<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Pipeline Results</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172026;
      --muted: #64707d;
      --border: #d9dee5;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --accent-soft: #e3f4f1;
      --warm: #b45309;
      --warm-soft: #fff3df;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(260px, 360px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside,
    .runs,
    main {
      padding: 24px;
    }

    aside {
      border-right: 1px solid var(--border);
      background: #fbfcfd;
    }

    .runs {
      border-right: 1px solid var(--border);
      background: #ffffff;
    }

    main {
      overflow: auto;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .button-list {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    button:hover {
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .button-title {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .button-meta {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #edf2f7;
      color: #334155;
      font-size: 12px;
      line-height: 1;
    }

    .stats {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-row,
    .report-link {
      display: grid;
      gap: 6px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .stat-row strong {
      font-size: 18px;
    }

    .stat-row a,
    .report-link a {
      color: var(--accent-strong);
      font-weight: 700;
      text-decoration: none;
    }

    .stat-row a:hover,
    .report-link a:hover {
      text-decoration: underline;
    }

    .stat-source,
    .report-source {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 16px;
      background: rgba(255, 255, 255, 0.7);
    }

    .source-line {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .run-heading {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .run-heading h2 {
      margin: 0;
    }

    .metric {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--warm-soft);
      color: var(--warm);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside,
      .runs {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>

  <script>
    const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
    let activeSpeciesId = DATA.species[0] ? DATA.species[0].id : null;
    let activeRunId = null;

    const speciesList = document.getElementById("speciesList");
    const runList = document.getElementById("runList");
    const detail = document.getElementById("detail");
    document.getElementById("speciesCount").textContent = DATA.species.length;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function currentSpecies() {
      return DATA.species.find((species) => species.id === activeSpeciesId) || DATA.species[0];
    }

    function currentRun(species) {
      if (!species || !species.runs.length) {
        return null;
      }
      const existing = species.runs.find((run) => run.id === activeRunId);
      return existing || species.runs[0];
    }

    function regexSummary(species) {
      if (!species.regex.length) {
        return "No regex summary";
      }
      if (species.regex.length === 1) {
        const stat = species.regex[0];
        return `${stat.unique}/${stat.total} unique genes`;
      }
      return `${species.regex.length} regex summaries`;
    }

    function renderSpeciesList() {
      speciesList.innerHTML = "";
      DATA.species.forEach((species) => {
        const button = document.createElement("button");
        button.className = species.id === activeSpeciesId ? "active" : "";
        button.type = "button";
        button.innerHTML = `
          <span class="button-title">${escapeHtml(species.name)}</span>
          <span class="button-meta">${species.runs.length} runs, ${regexSummary(species)}</span>
        `;
        button.addEventListener("click", () => {
          activeSpeciesId = species.id;
          activeRunId = species.runs[0] ? species.runs[0].id : null;
          render();
        });
        speciesList.appendChild(button);
      });
    }

    function renderRunList(species) {
      runList.innerHTML = "";
      if (!species || !species.runs.length) {
        runList.innerHTML = '<div class="empty">No copied HTML runs found for this species.</div>';
        return;
      }

      species.runs.forEach((run) => {
        const button = document.createElement("button");
        button.className = run.id === activeRunId ? "active" : "";
        button.type = "button";
        const tags = run.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
        button.innerHTML = `
          <span class="button-title">${escapeHtml(run.name)}</span>
          <span class="button-meta">${run.reports.length} reports</span>
          <span class="tags">${tags}</span>
        `;
        button.addEventListener("click", () => {
          activeRunId = run.id;
          render();
        });
        runList.appendChild(button);
      });
    }

    function renderRegexStats(species) {
      if (!species.regex.length) {
        return '<div class="empty">No Santhakumar_2018 regex summary TSV was found for this species.</div>';
      }
      return `
        <div class="stats">
          ${species.regex.map((stat) => `
            <div class="stat-row">
              <strong>${stat.unique} of ${stat.total} unique genes with hits</strong>
              <span>${stat.percent === null ? "n/a" : stat.percent.toFixed(1) + "%"} of genes in source set</span>
              <a href="${escapeHtml(stat.href)}">${escapeHtml(stat.source)}</a>
              <span class="stat-source">${escapeHtml(stat.file)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderReports(run) {
      if (!run) {
        return '<div class="empty">Select a species with copied HTML runs to show report links.</div>';
      }
      return `
        <div class="run-heading">
          <h2>${escapeHtml(run.name)}</h2>
          <span class="metric">${run.reports.length} HTML reports</span>
        </div>
        <p class="source-line">Copied from ${escapeHtml(run.source_dir)} to results/${escapeHtml(run.dest_dir)}/</p>
        <div class="report-grid">
          ${run.reports.map((report) => `
            <div class="report-link">
              <a href="${escapeHtml(report.href)}">${escapeHtml(report.label)}</a>
              <span class="report-source">${escapeHtml(report.filename)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderDetail(species, run) {
      if (!species) {
        detail.innerHTML = '<div class="empty">No results were found.</div>';
        return;
      }
      detail.innerHTML = `
        <h2>${escapeHtml(species.name)}</h2>
        <h3>Santhakumar 2018 ISRE regex hits</h3>
        ${renderRegexStats(species)}
        <h3>Selected run</h3>
        ${renderReports(run)}
      `;
    }

    function render() {
      const species = currentSpecies();
      if (species && (!activeRunId || !species.runs.some((run) => run.id === activeRunId))) {
        activeRunId = species.runs[0] ? species.runs[0].id : null;
      }
      const run = currentRun(species);
      renderSpeciesList();
      renderRunList(species);
      renderDetail(species, run);
    }

    render();
  </script>
